<!-- Task Tracker Feature -->
<section id="task-tracker">
    <h2>My Task Tracker</h2>
    <p>Use this section to add and manage your tasks.</p>

    <form id="task-form">
        <label for="task-input">Enter a new task:</label>
        <input
            type="text"
            id="task-input"
            placeholder="Enter your task"
            maxlength="200"
            required
        >
        <button type="submit">Add Task</button>
    </form>

    <h3>My Tasks</h3>
    <ul id="task-list"></ul>

    <p id="task-message" aria-live="polite"></p>
</section>
<!-- End Task Tracker Feature -->
